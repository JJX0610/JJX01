<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蒋静娴 | 个人名片</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 页面主容器：负责让名片在视口中水平、垂直居中 -->
  <main class="page-container">
    <!-- 个人名片主体 -->
    <article class="profile-card">
      <!-- 使用姓名首字作为头像占位，避免依赖外部图片资源 -->
      <div class="avatar" aria-label="蒋静娴的头像">蒋</div>

      <!-- 个人基本信息 -->
      <div class="profile-info">
        <p class="eyebrow">HELLO, I AM</p>
        <h1>蒋静娴</h1>
        <p class="job-title">UI / UX 设计师</p>
        <p class="bio">专注于创造清晰、温暖且易于使用的数字体验。</p>
      </div>

      <!-- 联系方式列表 -->
      <address class="contact-list">
        <a href="mailto:hello@jjx0610.com" class="contact-item">
          <span class="contact-icon" aria-hidden="true">@</span>
          <span>hello@jjx0610.com</span>
        </a>
        <a href="tel:+8613800138000" class="contact-item">
          <span class="contact-icon" aria-hidden="true">+86</span>
          <span>138 0013 8000</span>
        </a>
        <a href="https://www.jjx0610.com" class="contact-item" target="_blank" rel="noopener noreferrer">
          <span class="contact-icon" aria-hidden="true">↗</span>
          <span>www.jjx0610.com</span>
        </a>
      </address>
    </article>
  </main>
</body>
</html>
